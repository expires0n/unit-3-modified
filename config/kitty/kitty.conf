# ── NieR:Automata Terminal — Kitty Config ──

# Police
font_family      SF Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Espacement
letter_spacing   0.5
line_height      1.2

# Palette Pastel Dusk (mor ağırlıklı pastel)
foreground            #D8CDF5
background            #14101D
selection_foreground  #14101D
selection_background  #D8CDF5

# Curseur
cursor                #F0A6D6
cursor_trail          3
cursor_trail_decay    0.1 0.4
cursor_text_color     #14101D
cursor_shape          block
cursor_blink_interval 0.8

# Couleurs ANSI — Pastel Dusk
color0  #14101D
color1  #F0A6D6
color2  #8B7BC7
color3  #D8CDF5
color4  #A78BFA
color5  #F0A6D6
color6  #8B7BC7
color7  #D8CDF5
color8  #5A4678
color9  #F0A6D6
color10 #D8CDF5
color11 #F0A6D6
color12 #A78BFA
color13 #F0A6D6
color14 #D8CDF5
color15 #D8CDF5

# Fenêtre
window_padding_width     20
background_opacity       0.92
dynamic_background_color no

# Scrollback
scrollback_lines 5000

# Onglets — on les cache (sobre)
tab_bar_style hidden

# Pas de bell
enable_audio_bell no
visual_bell_duration 0.0

# Url
url_color   #F0A6D6
url_style   single

# Titre fenêtre sobre
title_template "{title}"
