# ═══════════════════════════════════════════════════════════════════
# Personal Hyprland overrides
# This file is created empty by the installer and is NEVER overwritten
# by future updates. Put your monitor configs, custom binds, env vars,
# theme tweaks, etc. here.
#
# Examples:
#   monitor = DP-1, 2560x1440@144, 0x0, 1
#   bind    = SUPER, B, exec, firefox
#   env     = GTK_THEME, Adwaita-dark
# ═══════════════════════════════════════════════════════════════════

# Klavye: Türkçe Q (eski CachyOS ayarın tr idi)
input {
    kb_layout = tr
}

# Monitörler: sol DP, sağ HDMI (ana), ikisi de 75Hz
monitor = DP-3, 1920x1080@75, 0x0, 1
monitor = HDMI-A-1, 1920x1080@75, 1920x0, 1

# Duvar kağıdı: SUPER+P seçimi (current-wallpaper) girişlerde geri gelir
exec-once = sleep 2 && awww img "$(cat ~/.config/hypr/current-wallpaper)"

# İmleç: macOS (siyah)
env = XCURSOR_THEME,macOS
exec-once = hyprctl setcursor macOS 24
